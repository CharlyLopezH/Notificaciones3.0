{% extends "base.html" %}

{% block title %}Eliminar Usuario{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle"></i> Confirmar Eliminación
                    </h4>
                </div>
                <div class="card-body text-center">
                    <i class="bi bi-person-x display-1 text-danger mb-3"></i>
                    <h5>¿Eliminar usuario <strong>{{ usuario.username }}</strong>?</h5>
                    <p class="text-muted">Perfil: {{ usuario.get_rol_display }}</p>
                    
                    <div class="alert alert-warning">
                        <i class="bi bi-info-circle"></i> Esta acción no se puede deshacer.
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3 mt-3">
                            <a href="{% url 'usuarios:lista_usuarios' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-check-circle"></i> Sí, Eliminar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
