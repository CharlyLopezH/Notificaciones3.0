{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}

<!--  -->
    <div class="container bg-white p-4 rounded shadow-sm border" style="max-width: 600px;">
        <h5>{{ titulo }}</h5>
        <hr>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary">Área/Adscripción*</label>
                {{ form.nombre }}
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-medium text-secondary">Nombre Corto *</label>
                    {{ form.nombre_corto }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium text-secondary">Extensión Telefónica</label>
                    {{ form.extension_telefono }}
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'areas:lista_areas' %}" class="btn btn-sm btn-outline-secondary px-3">Cancelar</a>
                <button type="submit" class="btn btn-sm btn-primary px-4">Guardar Área</button>
            </div>
        </form>
    </div>
</body>
</html>
{% endblock %}
