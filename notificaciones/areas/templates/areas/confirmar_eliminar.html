<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Área</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white py-2">
                        <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h5>
                    </div>
                    <div class="card-body text-center py-4">
                        <i class="bi bi-building-x display-4 text-danger"></i>
                        <p class="mt-3 mb-2">¿Eliminar el área <strong>{{ area.nombre }}</strong>?</p>
                        <p class="text-muted small">({{ area.nombre_corto }})</p>
                        <div class="alert alert-warning py-2 small">
                            <i class="bi bi-info-circle"></i> Esta acción es irreversible.
                        </div>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-2 mt-3">
                                <a href="{% url 'areas:lista_areas' %}" class="btn btn-sm btn-outline-secondary px-3">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-sm btn-danger px-3">
                                    <i class="bi bi-check-circle"></i> Eliminar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
